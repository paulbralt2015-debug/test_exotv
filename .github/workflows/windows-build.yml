name: Windows 10/11 build
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure Qt and FFmpeg
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=x64-windows" "-DVCPKG_MANIFEST_MODE=ON" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt and FFmpeg runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter ExoTVModern.exe | Select-Object -First 1
          if (-not $exe) { throw "ExoTVModern.exe not found" }
          windeployqt --release --compiler-runtime $exe.FullName
          $ffmpegBin = Join-Path $PWD "vcpkg_installed/x64-windows/bin"
          if (Test-Path $ffmpegBin) { Copy-Item (Join-Path $ffmpegBin "*.dll") $exe.Directory.FullName -Force }
          else { throw "FFmpeg runtime directory not found: $ffmpegBin" }
      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter ExoTVModern.exe | Select-Object -First 1
          if (-not $exe) { throw "ExoTVModern.exe not found for packaging" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") package -Recurse -Force
          Compress-Archive -Path package/* -DestinationPath ExoTVModern-Windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExoTVModern-Windows-x64
          path: ExoTVModern-Windows-x64.zip
          if-no-files-found: error
